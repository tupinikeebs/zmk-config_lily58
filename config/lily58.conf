# Uncomment to enable encoder
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# No OLED is fitted on either half. Uncomment to enable the Lily58 OLED Display
# CONFIG_ZMK_DISPLAY=y

# Mouse support
CONFIG_ZMK_POINTING=y

# Better connection on bt. Radio TX power is set PER HALF (lily58_left.conf /
# lily58_right.conf): BT_CTLR_TX_PWR is a Kconfig choice, so a shared value
# can't be overridden by one half.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Battery level
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
