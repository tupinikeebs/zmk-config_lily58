# Right half = split PERIPHERAL (has the trackpad).

# Radio TX power: this half's only link is to the central a few cm away, so
# +8 dBm buys nothing but current (~14-16 mA per transmit at +8 dBm vs ~5 mA at
# 0 dBm), and it is the half that transmits most (~100 trackpad reports/s).
# If the split link gets flaky, step up to PLUS_4, then PLUS_8.
CONFIG_BT_CTLR_TX_PWR_0=y
