# Left half = split CENTRAL (Lily58 default).

# Hi-res ("smooth") scrolling. Only meaningful on the CENTRAL: it builds the HID
# report descriptor, and this adds the wheel Resolution Multiplier that lets the
# host read wheel counts as fractions of a line. The right half's trackpad emits
# 1/16-line ticks (scroll-steps-per-line in lily58_right.overlay); without this
# the host would read each tick as a full line.
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# Radio TX power: the central drives the link to the host, so it keeps range.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
